[package]
name = "signet-mls"
version = "0.1.0"
edition = "2021"
publish = false
description = "Signet's native crypto: MLS (RFC 9420, via OpenMLS), ECVRF (RFC 9381) and SPAKE2 pairing, with Node bindings"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tls_codec = "0.5"
curve25519-dalek = "4"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
spake2 = "0.4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
